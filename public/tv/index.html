<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showrunner 电视端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { cursor: none; }
  body.interactive, body.dev { cursor: default; }
  body.dev { background: #0b0d10; }
  #devBadge {
    position: fixed; left: 12px; top: 10px; z-index: 200; pointer-events: none;
    padding: 4px 10px; border-radius: 6px; background: #8a6d00; color: #fff;
    font: 12px/1.5 Consolas, monospace; letter-spacing: 1px; opacity: .85;
  }
  #devBadge[hidden] { display: none; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #standby, #webnote {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    color: #666; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; text-align: center; padding: 0 48px;
  }
  #standby.show, #webnote.show { display: flex; }
  #standby .icon, #webnote .icon { font-size: 64px; margin-bottom: 24px; }
  #standby .main, #webnote .main { font-size: 28px; color: #999; }
  #standby .sub, #webnote .sub { font-size: 16px; color: #555; margin-top: 12px; }
  body.interactive { cursor: default; }
  #channelControls {
    position: fixed; right: 5vw; top: 10vh; bottom: 10vh; z-index: 10; display: none;
    width: min(440px, 88vw); flex-direction: column; gap: 10px; align-items: stretch;
    padding: 28px; border-radius: 18px; overflow-y: auto;
    background: rgba(12,12,12,.95); color: #eee; font-family: "Microsoft YaHei", sans-serif;
    box-shadow: 0 16px 60px rgba(0,0,0,.55);
  }
  #channelControls.show { display: flex; }
  #channelControls h2 { font-size: 28px; margin-bottom: 4px; }
  #channelControls .hint, #vodPanel .hint { color: #888; font-size: 14px; margin-bottom: 10px; }
  #channelControls button, #vodPanel button {
    border: 1px solid #555; background: #222; color: #ddd; border-radius: 8px;
    padding: 15px 18px; font-size: 20px; cursor: pointer;
  }
  #channelControls button.on { background: #eee; color: #111; }
  #channelControls button.focused, #vodPanel button.focused {
    outline: 4px solid #fff; outline-offset: 2px; border-color: #fff;
  }
  #vodPanel {
    position: fixed; inset: 8% 10%; z-index: 11; display: none; overflow-y: auto;
    padding: 24px; border-radius: 16px; background: rgba(10,10,10,.96);
    color: #eee; font-family: "Microsoft YaHei", sans-serif;
  }
  #vodPanel.show { display: block; }
  #vodPanel h2 { margin-bottom: 8px; font-size: 28px; }
  #vodPanel button { display: block; width: 100%; text-align: left; margin-bottom: 8px; }
  #firstSetup {
    position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
    align-items: center; justify-content: center; padding: 48px; text-align: center;
    background: radial-gradient(circle at center, #20242b 0, #08090b 65%);
    color: #eee; font-family: "Microsoft YaHei", sans-serif;
  }
  #firstSetup.show { display: flex; }
  #firstSetup h1 { font-size: 42px; margin-bottom: 16px; }
  #firstSetup .lead { font-size: 22px; color: #bbb; }
  #setupCode { font: 700 72px/1.2 Consolas, monospace; letter-spacing: 18px; margin: 34px 0; color: #fff; }
  #setupUrls { font-size: 22px; line-height: 1.7; color: #9fd1ff; }
  #firstSetup .safe { margin-top: 28px; color: #777; font-size: 16px; }
</style>
</head>
<body>
<video id="player" playsinline></video>
<div id="standby">
  <div class="icon">📺</div>
  <div class="main">频道空闲</div>
  <div class="sub">等待家长安排新节目</div>
</div>
<div id="webnote">
  <div class="icon">🌐</div>
  <div class="main" id="webTitle">网页片源</div>
  <div class="sub" id="webSub">正在准备…</div>
</div>
<div id="firstSetup">
  <h1 id="setupTitle">首次设置 Showrunner</h1>
  <div class="lead" id="setupLead">用手机打开下面的遥控器地址，然后输入配对码并设置长期密码</div>
  <div id="setupCode">------</div>
  <div id="setupUrls"></div>
  <div class="safe" id="setupSafe">配对码只在这台电视上显示，设置完成后立即失效</div>
</div>
<div id="channelControls"></div>
<div id="vodPanel"><h2 id="vodTitle">选择节目</h2><div class="hint">方向键选择　左键 / Enter 确认　右键返回</div><div id="vodItems"></div><button id="vodClose">返回频道</button></div>
<div id="devBadge" hidden>DEV · 非托管调试 · 右键/F12 可用</div>
<script>
'use strict';
/*
 * 电视播放端 —— 服务端权威的受限终端。
 * 只允许用最小遥控器按键查看/切换已启用频道，以及点播获准披露的节目。
 * 网页片源播放服务器预下载的缓存文件；未缓存完成时黑屏等待，失败时跳过。
 */
const video = document.getElementById('player');
const standby = document.getElementById('standby');
const $ = id => document.getElementById(id);
const webnote = $('webnote');

async function refreshFirstSetup() {
  try {
    const response = await fetch('/tv/setup-info', { cache: 'no-store' });
    if (!response.ok) return $('firstSetup').classList.remove('show');
    const info = await response.json();
    const migration = info.storageMigration;
    const recovery = info.passwordRecovery;
    $('firstSetup').classList.toggle('show', !!info.required || !!migration?.required || !!recovery?.required);
    if (!info.required && !migration?.required && !recovery?.required) return;
    if (migration?.required) {
      $('setupTitle').textContent = '需要确认数据迁移';
      $('setupLead').textContent = migration.conflict
        ? '旧程序目录和新数据目录都有内容。播放已暂停，请用手机明确选择使用哪一份。'
        : '检测到旧版内置数据。播放已暂停，请用手机确认后再迁移。';
      $('setupSafe').textContent = '未确认前不会复制、删除或写入旧数据；迁移后旧目录仍保留';
    } else if (recovery?.required) {
      $('setupTitle').textContent = '重置 Showrunner 密码';
      $('setupLead').textContent = '请在手机遥控器上输入下面的一次性重置码，然后设置新密码';
      $('setupSafe').textContent = '重置码 10 分钟内有效；完成后所有旧会话立即失效';
    }
    $('setupCode').textContent = String(migration?.code || recovery?.code || info.code || '').replace(/(.{3})/, '$1 ');
    const urls = info.remoteUrls?.length ? info.remoteUrls : [`http://本机IP:${location.port || 7100}/remote/`];
    $('setupUrls').replaceChildren(...urls.map(url => {
      const line = document.createElement('div'); line.textContent = url; return line;
    }));
  } catch {}
}
refreshFirstSetup();
setInterval(refreshFirstSetup, 2000);

// 接管浏览器右键菜单和双击全屏：物理遥控器的“菜单”键在系统层常被当作鼠标右键
// （空中飞鼠右键、VK_APPS 上下文键），不接管会同时弹出 Chrome 原生菜单。
// 右键作为遥控器的菜单/返回键。Shift+右键保留为调试逃生门（原生菜单/检查元素）。
const unmanaged = window.__SHOWRUNNER_UNMANAGED__ === true; // 仅控制光标与徽标
if (unmanaged) {
  document.body.classList.add('dev');
  $('devBadge').hidden = false;
  // 按键显示：屏幕右下角短暂显示按下的键/鼠标键，便于核对物理遥控器实际发送的键值。
  // repeat=true 表示长按自动重复——这正是 mpv 里“按住键盘右键菜单反复开关”的原因。
  const keyOsd = document.createElement('div');
  keyOsd.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99;background:rgba(0,0,0,.75);color:#3f6;font:16px/1.5 monospace;padding:6px 14px;border-radius:6px;pointer-events:none;display:none';
  document.body.appendChild(keyOsd);
  let keyOsdTimer = null;
  const showKey = label => {
    keyOsd.textContent = label;
    keyOsd.style.display = '';
    clearTimeout(keyOsdTimer);
    keyOsdTimer = setTimeout(() => { keyOsd.style.display = 'none'; }, 1200);
  };
  const mouseName = b => ({ 0: '左键', 1: '中键', 2: '右键', 3: '侧键-后退', 4: '侧键-前进' })[b] || ('键' + b);
  // 记录最近事件并显示与上一事件的毫秒间隔：遥控器连发/双重触发一目了然。
  // window.__keyEvents 供诊断读取。
  let lastKeyEventAt = 0;
  window.__keyEvents = [];
  const recordKey = (type, label, key) => {
    const now = Date.now();
    const delta = lastKeyEventAt ? now - lastKeyEventAt : 0;
    lastKeyEventAt = now;
    window.__keyEvents.push({ t: now, type, key, delta });
    if (window.__keyEvents.length > 24) window.__keyEvents.shift();
    showKey(`${label} +${delta}ms`);
  };
  window.addEventListener('keydown', e => recordKey('keydown', `↓ ${e.key} (code=${e.code}${e.repeat ? ', repeat' : ''})`, e.key), true);
  window.addEventListener('keyup', e => recordKey('keyup', `↑ ${e.key} (code=${e.code})`, e.key), true);
  window.addEventListener('contextmenu', () => recordKey('contextmenu', '≡ contextmenu 事件', 'ContextMenu'), true);
  window.addEventListener('mousedown', e => showKey(`鼠标${e.detail > 1 ? e.detail + '击' : ''}${mouseName(e.button)} button=${e.button}`), true);
  window.addEventListener('wheel', e => showKey(`滚轮 ΔY=${e.deltaY}`), { capture: true, passive: true });
}
// 遥控器 ContextMenu 键按下后，Chrome 除了 keydown 还会补发一个 contextmenu 事件；
// 两个入口必须合并成一次菜单切换，否则按一下=开+关两次切换，菜单永远关不掉。
let lastCtxMenuKeyAt = 0;
window.addEventListener('contextmenu', e => {
  if (e.shiftKey) return; // 调试逃生门
  e.preventDefault();
  if (Date.now() - lastCtxMenuKeyAt < 120) return; // 键盘 ContextMenu 键已由 keydown 处理
  if (!$('firstSetup').classList.contains('show')) remoteMenuKeyDebounced();
}, { capture: true });
window.addEventListener('dblclick', e => { if (!e.shiftKey) e.preventDefault(); }, { capture: true });
// 菜单/返回键的 keyup 同样吞掉：部分按键（如 ContextMenu）浏览器在 keyup 阶段
// 仍有默认行为（弹原生菜单/焦点转移），只拦 keydown 不够。
window.addEventListener('keyup', e => {
  if (e.key === 'Escape' || e.key === 'ContextMenu' || e.key === 'BrowserBack' || e.key === 'Back') {
    e.preventDefault(); e.stopPropagation();
  }
}, { capture: true });
video.controls = false;
video.disablePictureInPicture = true;

let currentSrc = null;   // 当前正在播的流地址
let currentWebQid = null;
let webSkipTimer = null;
let ws = null;
let lastState = null;
let controlsTimer = null;
let remoteLayer = 'closed'; // closed | channels | vod
let remoteFocus = 0;
let cutoffSentQid = null;
let healthQid = null;
let lastProgressPosition = 0;
let lastProgressAt = Date.now();
let issueSentQid = null;
let issueSentAt = 0;
let compatibilityRequestedQid = null;

function resetPlaybackHealth(qid = null, position = 0) {
  healthQid = qid;
  lastProgressPosition = Number(position) || 0;
  lastProgressAt = Date.now();
  if (issueSentQid !== qid) { issueSentQid = null; issueSentAt = 0; }
  if (compatibilityRequestedQid !== qid) compatibilityRequestedQid = null;
}

function reportPlaybackIssue(kind, detail, expectedQid = null) {
  const cur = lastState?.current;
  if (!cur || !ws || ws.readyState !== 1) return;
  if (expectedQid && expectedQid !== cur.qid) return;
  if (!currentSrc && kind !== 'source_error') return;
  const now = Date.now();
  if (issueSentQid === cur.qid && now - issueSentAt < 30000) return;
  issueSentQid = cur.qid;
  issueSentAt = now;
  ws.send(JSON.stringify({
    type: 'playbackIssue', qid: cur.qid, kind, detail: String(detail || '').slice(0, 500),
    position: video.currentTime || 0, duration: video.duration || 0,
    readyState: video.readyState, networkState: video.networkState
  }));
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws-tv`);

  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'state') applyState(msg.data);
  };
  ws.onclose = () => setTimeout(connect, 2000); // 断线自动重连
}

function stopPlayback() {
  video.pause();
  video.removeAttribute('src');
  video.load();
  currentSrc = null;
  resetPlaybackHealth();
}

function showWebnote(cur, sub) {
  stopPlayback();
  $('webTitle').textContent = cur.cachedTitle || cur.title;
  $('webSub').textContent = sub;
  webnote.classList.add('show');
}

function playStream(src, s) {
  if (src !== currentSrc) {
    // 先卸载旧资源，强制 Chromium 立即取消上一个 HTTP/NAS 媒体流。
    // 连续跳过不可播文件时，不让多个旧请求同时占用文件句柄。
    video.pause();
    video.removeAttribute('src');
    video.load();
    currentSrc = src;
    video.src = src;
    resetPlaybackHealth(s.current?.qid, s.position);
  }
  video.volume = s.volume;

  // 进度纠偏：与权威进度差超过 3 秒才 seek，避免来回拉扯
  if (Math.abs(video.currentTime - s.position) > 3) {
    video.currentTime = s.position;
  }

  if (s.status === 'playing' && video.paused) {
    const expectedQid = s.current?.qid;
    video.play().catch(error => reportPlaybackIssue('play_rejected', error?.message || 'video.play() 被拒绝', expectedQid));
  }
  if (s.status !== 'playing' && !video.paused) video.pause();
}

function applyState(s) {
  lastState = s;
  renderChannelControls(s);
  const cur = s.current;
  if (!cur) {
    stopPlayback();
    currentWebQid = null;
    clearTimeout(webSkipTimer);
    webnote.classList.remove('show');
    $('standby').querySelector('.main').textContent = s.waiting?.reason === 'on-demand' ? '请选择节目' : '频道空闲';
    const when = s.waiting?.nextStartAt ? new Date(s.waiting.nextStartAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
    $('standby').querySelector('.sub').textContent = s.waiting?.nextTitle
      ? `${when} 播放：${s.waiting.nextTitle}` : (s.waiting?.reason === 'on-demand' ? '按右键打开节目菜单' : '等待下一档节目');
    standby.classList.add('show');
    return;
  }
  if (healthQid !== cur.qid) resetPlaybackHealth(cur.qid, s.position);
  cutoffSentQid = cutoffSentQid === cur.qid ? cutoffSentQid : null;
  standby.classList.remove('show');

  // 网页片源：优先播放服务器缓存；未就绪则等待，失败则 6 秒后跳过
  if (cur.type === 'web') {
    if (cur.stream) {
      // 已缓存完成 → 当作普通视频播放
      currentWebQid = null;
      clearTimeout(webSkipTimer);
      webnote.classList.remove('show');
      playStream(cur.stream, s);
      return;
    }
    if (cur.qid !== currentWebQid) {
      currentWebQid = cur.qid;
      clearTimeout(webSkipTimer);
      if (cur.cacheError) {
        showWebnote(cur, '缓存失败：' + cur.cacheError + '，即将跳过…');
        if (ws && ws.readyState === 1) {
          webSkipTimer = setTimeout(() => reportPlaybackIssue('source_error', cur.cacheError, cur.qid), 6000);
        }
      }
    }
    if (!cur.cacheError) {
      const pct = Math.floor(cur.progress || 0);
      showWebnote(cur, cur.cacheStatus === 'downloading' ? `正在缓存 ${pct}%…` : '正在准备…');
    }
    return;
  }

  // 合集条目未解析成功（合集为空/被删）：提示并跳过
  if (cur.type === 'collection') {
    if (cur.qid !== currentWebQid) {
      currentWebQid = cur.qid;
      clearTimeout(webSkipTimer);
      showWebnote(cur, (cur.cacheError || '合集为空') + '，即将跳过…');
      if (ws && ws.readyState === 1) {
        webSkipTimer = setTimeout(() => reportPlaybackIssue('source_error', cur.cacheError || '合集为空', cur.qid), 6000);
      }
    }
    return;
  }

  // 浏览器不支持原格式时，服务端在后台生成 H.264/AAC MP4；完成后自动改播兼容缓存。
  if (cur.compatibilityStatus) {
    if (cur.compatibilityStatus === 'ready' && cur.stream) {
      currentWebQid = null;
      clearTimeout(webSkipTimer);
      webnote.classList.remove('show');
      playStream(cur.stream, s);
      return;
    }
    if (cur.compatibilityStatus === 'failed') {
      showWebnote(cur, `兼容转换失败：${cur.compatibilityError || '未知错误'}，即将跳过…`);
      if (cur.qid !== currentWebQid) {
        currentWebQid = cur.qid;
        clearTimeout(webSkipTimer);
        webSkipTimer = setTimeout(() => {
          if (ws && ws.readyState === 1 && lastState?.current?.qid === cur.qid) {
            ws.send(JSON.stringify({ type: 'ended', qid: cur.qid, reason: 'compatibility_failed' }));
          }
        }, 6000);
      }
      return;
    }
    currentWebQid = cur.qid;
    clearTimeout(webSkipTimer);
    showWebnote(cur, '原格式无法直接播放，正在转换为兼容格式…');
    return;
  }
  currentWebQid = null;
  clearTimeout(webSkipTimer);
  webnote.classList.remove('show');
  playStream(`/media/${cur.mediaId}/stream`, s);
}

// 播完上报，服务端自动连播
video.addEventListener('ended', () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ended', qid: lastState?.current?.qid }));
});

video.addEventListener('error', () => {
  const names = { 1: 'MEDIA_ERR_ABORTED', 2: 'MEDIA_ERR_NETWORK', 3: 'MEDIA_ERR_DECODE', 4: 'MEDIA_ERR_SRC_NOT_SUPPORTED' };
  const code = video.error?.code || 0;
  const cur = lastState?.current;
  if (cur?.type === 'local' && !cur.compatibilityStatus && (code === 3 || code === 4) && compatibilityRequestedQid !== cur.qid) {
    compatibilityRequestedQid = cur.qid;
    ws?.send(JSON.stringify({ type: 'compatibilityRequest', qid: cur.qid, kind: 'media_error', detail: names[code] }));
    return;
  }
  reportPlaybackIssue('media_error', names[code] || `HTMLMediaElement error ${code || 'unknown'}`, healthQid);
});

video.addEventListener('playing', () => { lastProgressAt = Date.now(); });

// 节目播放上限：用于裁掉视频片尾垫料；服务端也有心跳兜底。
video.addEventListener('timeupdate', () => {
  const cur = lastState?.current;
  if (video.currentTime > lastProgressPosition + 0.5) {
    lastProgressPosition = video.currentTime;
    lastProgressAt = Date.now();
  }
  if (cur?.maxPlaySeconds && video.currentTime >= cur.maxPlaySeconds && cutoffSentQid !== cur.qid) {
    cutoffSentQid = cur.qid;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ended', qid: cur.qid, reason: 'cutoff' }));
  }
});

// 每 5 秒回报真实进度；要求播放却连续 20 秒无进展时先记录并跳过。
setInterval(() => {
  if (ws && ws.readyState === 1 && currentSrc) {
    const cur = lastState?.current;
    ws.send(JSON.stringify({
      type: 'position', qid: cur?.qid, position: video.currentTime, duration: video.duration || 0,
      paused: video.paused, readyState: video.readyState, networkState: video.networkState
    }));
    if (lastState?.status === 'playing' && cur && Date.now() - lastProgressAt >= 20000) {
      reportPlaybackIssue(video.paused ? 'unexpected_pause' : 'frozen',
        video.paused ? '服务端要求播放，但视频处于暂停状态' : '播放位置连续 20 秒未前进');
    }
  }
}, 5000);

connect();

function renderChannelControls(s) {
  const box = $('channelControls');
  const channels = s.channels || [];
  const selected = channels.find(c => c.id === s.selectedChannelId);
  const previous = box.querySelector('button.focused');
  const previousKey = previous?.dataset.channelId ? `channel:${previous.dataset.channelId}` : previous?.dataset.action || null;
  box.innerHTML = '<h2>频道</h2><div class="hint">方向键选择　左键 / Enter 确认　右键关闭</div>';
  channels.forEach(c => {
    const b = document.createElement('button');
    b.textContent = `${c.selected ? '正在播放　' : ''}${c.name}`;
    b.className = c.selected ? 'on' : '';
    b.dataset.channelId = c.id;
    b.onclick = () => {
      if (c.id !== lastState?.selectedChannelId) ws?.send(JSON.stringify({ type: 'selectChannel', channelId: c.id }));
      closeRemoteMenus();
    };
    b.onmouseenter = () => setRemoteFocus(menuButtons().indexOf(b));
    box.appendChild(b);
  });
  if (selected?.allowOnDemand) {
    const b = document.createElement('button');
    b.textContent = `浏览「${selected.name}」节目`;
    b.dataset.action = 'vod';
    b.onclick = () => openVod(selected);
    b.onmouseenter = () => setRemoteFocus(menuButtons().indexOf(b));
    box.appendChild(b);
  }
  if (remoteLayer === 'channels') {
    const buttons = [...box.querySelectorAll('button')];
    const selectedButton = previousKey === 'vod'
      ? buttons.find(button => button.dataset.action === 'vod')
      : previousKey?.startsWith('channel:')
        ? buttons.find(button => button.dataset.channelId === previousKey.slice(8))
        : buttons.find(button => button.dataset.channelId === (s.selectedChannelId || ''));
    const index = buttons.indexOf(selectedButton);
    setRemoteFocus(index >= 0 ? index : remoteFocus);
  }
}

function openVod(channel) {
  $('vodTitle').textContent = `「${channel.name}」节目点播`;
  const items = $('vodItems'); items.innerHTML = '';
  (channel.items || []).forEach(item => {
    const b = document.createElement('button'); b.textContent = item.title;
    b.onclick = () => { ws?.send(JSON.stringify({ type: 'onDemand', qid: item.qid })); closeRemoteMenus(); };
    b.onmouseenter = () => setRemoteFocus(menuButtons().indexOf(b));
    items.appendChild(b);
  });
  $('channelControls').classList.remove('show');
  $('vodPanel').classList.add('show');
  document.body.classList.add('interactive');
  remoteLayer = 'vod'; remoteFocus = 0; setRemoteFocus(0);
}

function menuButtons() {
  if (remoteLayer === 'vod') return [...$('vodPanel').querySelectorAll('button')];
  if (remoteLayer === 'channels') return [...$('channelControls').querySelectorAll('button')];
  return [];
}

function setRemoteFocus(index) {
  const buttons = menuButtons();
  document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
  if (!buttons.length) { remoteFocus = 0; return; }
  remoteFocus = ((Number(index) || 0) % buttons.length + buttons.length) % buttons.length;
  buttons[remoteFocus].classList.add('focused');
  buttons[remoteFocus].scrollIntoView({ block: 'nearest' });
}

function openChannelMenu() {
  clearTimeout(controlsTimer);
  remoteLayer = 'channels';
  $('vodPanel').classList.remove('show');
  $('channelControls').classList.add('show');
  document.body.classList.add('interactive');
  renderChannelControls(lastState || {});
}

function closeRemoteMenus() {
  clearTimeout(controlsTimer);
  remoteLayer = 'closed'; remoteFocus = 0;
  $('channelControls').classList.remove('show');
  $('vodPanel').classList.remove('show');
  document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
  document.body.classList.remove('interactive');
}

function remoteMenuKey() {
  if (remoteLayer === 'closed') openChannelMenu();
  else if (remoteLayer === 'vod') openChannelMenu();
  else closeRemoteMenus();
}

$('vodClose').onclick = () => openChannelMenu();

// 最小共同按键：鼠标右键菜单/返回，左键点击确认；四个方向键移动，Enter 也可确认。
// 物理遥控器长按会反复触发同一键（自动重复或离散重发）：菜单/确认类动作 200ms 去抖，
// 避免菜单反复开关、确认连击；方向键保留连发便于快速翻页。
let lastToggleKeyAt = 0;
// 菜单键两个入口（ContextMenu 键的 keydown、鼠标/键盘触发的 contextmenu 事件）共用去抖窗口。
function remoteMenuKeyDebounced() {
  const now = Date.now();
  if (now - lastToggleKeyAt < 200) return;
  lastToggleKeyAt = now;
  remoteMenuKey();
}
window.addEventListener('keydown', event => {
  const key = event.key;
  // HOME：普通 Home 键拦下当作“回到顶层”——关掉全部浮层回到纯播放画面；
  // 浏览器级的 Alt+Home/主页多媒体键拦不住导航，由受管 profile 的主页设置兜回电视页。
  if (key === 'Home') { event.preventDefault(); event.stopPropagation(); closeRemoteMenus(); return; }
  const isPrevious = key === 'ArrowUp' || key === 'ArrowLeft';
  const isNext = key === 'ArrowDown' || key === 'ArrowRight';
  const isConfirm = key === 'Enter' || key === 'OK' || key === 'Select';
  const isMenu = key === 'Escape' || key === 'ContextMenu' || key === 'BrowserBack' || key === 'Back';
  if (!isPrevious && !isNext && !isConfirm && !isMenu) return; // 音量、电源等系统键不拦截
  event.preventDefault(); event.stopPropagation();
  if (isMenu || isConfirm) {
    const now = Date.now();
    if (event.repeat || now - lastToggleKeyAt < 200) return;
    lastToggleKeyAt = now;
  }
  if (isMenu) {
    if (key === 'ContextMenu') lastCtxMenuKeyAt = Date.now();
    remoteMenuKey();
    return;
  }
  if (remoteLayer === 'closed') {
    if (isConfirm) return;
    openChannelMenu();
  }
  if (isPrevious || isNext) setRemoteFocus(remoteFocus + (isNext ? 1 : -1));
  else menuButtons()[remoteFocus]?.click();
}, { capture: true });

// 左键点菜单外等同取消。鼠标移动本身不再打开菜单，避免菜单刚关又被立即唤回。
window.addEventListener('click', event => {
  if (remoteLayer === 'closed') return;
  if ($('channelControls').contains(event.target) || $('vodPanel').contains(event.target)) return;
  closeRemoteMenus();
}, { capture: true });
</script>
</body>
</html>
