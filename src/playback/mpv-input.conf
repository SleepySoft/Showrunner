# 最小共同遥控器按键；音量键不拦截，由系统处理。
# 常见物理遥控器的菜单键发的是 MENU（VK_APPS 上下文键），一并映射。
# 遥控器一次按压会反复发送成对报文（间隔可达 ~300ms，尾部拖尾可达 ~400ms）：menu/back
# （切换类）由服务端按 400ms 连发簇合并（按住只触发一次）；confirm 300ms 速率限制
# （跟手，重复触发无害）；up/down 450ms 速率限制（太紧会一条跳两格）。
UP script-message showrunner-input up
DOWN script-message showrunner-input down
LEFT script-message showrunner-input confirm
ENTER script-message showrunner-input confirm
MENU script-message showrunner-input menu
RIGHT script-message showrunner-input menu
ESC script-message showrunner-input back
MBTN_LEFT script-message showrunner-input confirm
MBTN_RIGHT script-message showrunner-input menu
# HOME：mpv 默认绑定是回到片头，对遥控器太意外；显式忽略（Chrome 前端的 HOME 另有处理）。
HOME ignore
